name: Build

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build check only. No artifacts are uploaded, since binaries are not published.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [canable2, canable2-debug]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # git describe needs the tags

      # Same command as the Dependencies section of README.md
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y gcc-arm-none-eabi cmake ninja-build dfu-util git
          arm-none-eabi-gcc --version | head -n 1
          cmake --version | head -n 1

      # Same commands as the Building section of README.md,
      # with compiler warnings treated as errors
      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build --preset ${{ matrix.preset }}

      - name: Report size
        run: |
          echo '### ${{ matrix.preset }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          arm-none-eabi-size build/${{ matrix.preset }}/canable2.elf >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
